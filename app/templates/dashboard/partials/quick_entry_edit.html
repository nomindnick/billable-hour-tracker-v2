{#
Quick Entry Edit Form

Inline form for editing today's entry from the hero section.
Uses a different target than the recent entries list edit.

Used by: GET /entries/<id>/edit (when editing today's entry)
#}

<form hx-post="{{ url_for('entries.update_entry', entry_id=entry.id) }}"
      hx-target="#quick-entry-container"
      hx-swap="innerHTML"
      hx-indicator="#quick-edit-spinner"
      class="space-y-3">

    <div class="flex items-center space-x-2">
        <input type="number"
               name="hours"
               step="0.5"
               min="0"
               max="24"
               value="{{ entry.hours_billed }}"
               class="w-20 px-3 py-2 border border-gray-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
               id="quick-hours-input"
               autofocus>
        <span class="text-gray-500">hours</span>
    </div>

    <div class="flex space-x-2">
        <button type="submit"
                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors text-sm inline-flex items-center">
            <span id="quick-edit-spinner" class="htmx-indicator mr-2">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
            Save
        </button>
        <button type="button"
                hx-get="{{ url_for('dashboard.index') }}"
                hx-target="#quick-entry-container"
                hx-swap="innerHTML"
                hx-select="#quick-entry-container > *"
                class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 text-sm">
            Cancel
        </button>
    </div>
</form>
