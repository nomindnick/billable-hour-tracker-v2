{#
Quick Entry Form Partial

Shows the entry form for today's hours.
Used when returning from edit mode back to entry mode.

Used by: Various HTMX responses
#}

<form hx-post="{{ url_for('entries.create_entry') }}"
      hx-target="#quick-entry-container"
      hx-swap="innerHTML"
      hx-indicator="#quick-entry-spinner"
      class="flex items-center space-x-2">
    <input type="hidden" name="date" value="{{ today.isoformat() }}">
    <input type="number"
           name="hours"
           step="0.5"
           min="0"
           max="24"
           placeholder="0.0"
           required
           class="w-20 px-3 py-2 border border-gray-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
           id="quick-hours-input"
           autofocus>
    <span class="text-gray-500">hours</span>
    <button type="submit"
            class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors inline-flex items-center">
        <span id="quick-entry-spinner" class="htmx-indicator mr-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </span>
        Log
    </button>
</form>
