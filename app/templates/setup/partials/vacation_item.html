<div class="vacation-item flex items-center justify-between py-3">
    <div class="flex items-center">
        <span class="font-medium text-gray-900">{{ vacation.date.strftime('%b %d, %Y') }}</span>
        {% if vacation.note %}
        <span class="ml-2 text-gray-500">- {{ vacation.note }}</span>
        {% endif %}
    </div>
    <button
        hx-delete="{{ url_for('setup.delete_vacation', vacation_id=vacation.id) }}"
        hx-target="closest .vacation-item"
        hx-swap="outerHTML"
        hx-confirm="Remove this vacation day?"
        class="text-red-500 hover:text-red-700 text-sm font-medium"
    >
        Remove
    </button>
</div>
