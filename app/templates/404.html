{% extends "base.html" %}

{% block title %}Page Not Found - Billable Hours Planner{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">
        <!-- Friendly icon -->
        <div class="mb-6">
            <svg class="w-24 h-24 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <!-- Error message -->
        <h1 class="text-4xl font-bold text-gray-900 mb-2">404</h1>
        <h2 class="text-xl font-medium text-gray-700 mb-4">Page Not Found</h2>
        <p class="text-gray-500 mb-8">
            The page you're looking for doesn't exist or may have been moved.
            No worries—let's get you back on track.
        </p>

        <!-- Navigation options -->
        <div class="space-y-3">
            <a href="/" class="block w-full px-6 py-3 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                Go to Dashboard
            </a>
            <a href="/setup" class="block w-full px-6 py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition-colors">
                Start Setup
            </a>
        </div>
    </div>
</div>
{% endblock %}
